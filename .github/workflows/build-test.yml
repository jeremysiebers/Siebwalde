name: Build and test

# Continuous integration for the managed .NET solution.
# Pull requests against master and pushes to master are built and tested in Release.
on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

jobs:
  build-test:
    name: Build and test (Release)
    # The solution contains Windows/WPF projects (net8.0-windows), so a Windows runner is required.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore SiebwaldeApp/SiebwaldeApp.sln

      # Warnings are intentionally not suppressed: the build must stay honest about them.
      - name: Build (Release)
        run: dotnet build SiebwaldeApp/SiebwaldeApp.sln -c Release --no-restore

      # Runs every test project in the solution. A failing test fails the workflow.
      - name: Test (Release)
        run: dotnet test SiebwaldeApp/SiebwaldeApp.sln -c Release --no-build

      # The system-regression host is deliberately NOT part of the solution (it composes the real
      # production init pipeline against a deterministic offline simulator). Build it separately.
      - name: Build SystemRegressionHost (Release)
        run: dotnet build SiebwaldeApp/SiebwaldeApp.SystemRegressionHost/SiebwaldeApp.SystemRegressionHost.csproj -c Release

      # Run all six headless OFFLINE scenarios A-F. Each writes machine-readable JSONL evidence;
      # any non-zero exit code fails the workflow (and therefore the PR check). No flash, no live
      # hardware, no WPF UI, no interactive session and no path to a real controller.
      - name: Run system-regression scenarios (A-F)
        shell: pwsh
        run: |
          $exe = "SiebwaldeApp/SiebwaldeApp.SystemRegressionHost/bin/Release/net8.0-windows7.0/SiebwaldeApp.SystemRegressionHost.exe"
          $evidence = Join-Path $env:GITHUB_WORKSPACE "system-regression-evidence"
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $failed = @()
          foreach ($scenario in 'A','B','C','D','E','F') {
            Write-Host "Running system-regression scenario $scenario ..."
            $jsonl = Join-Path $evidence "scenario-$scenario.jsonl"
            & $exe --scenario $scenario --jsonl $jsonl
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::Scenario $scenario failed with exit code $LASTEXITCODE"
              $failed += $scenario
            }
          }
          if ($failed.Count -gt 0) {
            Write-Host "::error::System-regression scenarios failed: $($failed -join ', ')"
            exit 1
          }
          Write-Host "All six system-regression scenarios passed (exit 0)."

      # Preserve the machine-readable evidence (JSONL per scenario) as a build artifact, even on
      # failure, so results and diagnostics survive the run.
      - name: Upload system-regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-regression-evidence
          path: system-regression-evidence/
          if-no-files-found: warn
