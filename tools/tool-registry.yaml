# Siebwalde Engineering Tool Registry
#
# Durable, human- and machine-readable inventory of the project's engineering
# tooling. Technical properties (path, language, entry points, capabilities)
# are factual; `preservation_policy` and `po_decision` record Product Owner
# policy (see docs/SIEBWALDE-ENGINEERING-TOOL-REGISTRY.md).
#
# Lifecycle status: ACTIVE | PROTECTED | HISTORICAL | MAINTENANCE_ONLY | EXPERIMENTAL
# Preservation policy: KEEP | KEEP_ACTIVE_MCP | KEEP_PROTECTED | KEEP_HISTORICAL | PRESERVE_PENDING_REVIEW
#
# Never invent a validation status. "physically_proven", "offline_tested",
# "source_supported" reflect the evidence actually recorded for that tool.

format_version: 1
tools:
  - id: picoscope-mcp
    name: PicoScope 3406D MSO instrument tooling + MCP
    path: tools/picoscope/
    purpose: Oscilloscope acquisition, digital edge trigger, UART decode, PWM/timing analysis, evidence capture, OpenCode MCP.
    lifecycle: ACTIVE
    preservation_policy: KEEP_ACTIVE_MCP
    po_decision: "K4 §5.1 KEEP — ACTIVE / ACCEPTED MCP"
    language: Python
    runtime: project venv (tools/picoscope/.venv)
    entry_points: [tools.picoscope.mcp (python -m tools.picoscope.mcp), tools/picoscope/demo.py]
    hardware: PicoScope 3406D MSO (USB)
    side_effect: MEASUREMENT_ONLY (read-only acquisition; no AWG/signal generation, no flash/reset)
    capabilities:
      - native_ps3000a_backend
      - digital_acquisition
      - digital_edge_trigger
      - uart_decode_9bit_8bit
      - pwm_timing_analysis
      - npz_json_evidence
      - opencode_mcp
    offline_tested: true       # 278 PICO-4T tests
    physically_proven: true    # PICO-4T/PICO-5B captures
    source_revision: 1f89c0b
    mcp_service: picoscope
    migration_candidate: false
    related: [diagnostics-mcp]

  - id: knowledge-foundation
    name: LadybugDB Knowledge Foundation + Knowledge MCP
    path: tools/knowledge/
    purpose: Evidence-backed engineering knowledge graph (LadybugDB) + read-only Knowledge MCP.
    lifecycle: ACTIVE
    preservation_policy: KEEP_ACTIVE_MCP
    po_decision: "K4 §5.2 KEEP — ACTIVE / ACCEPTED MCP"
    language: Python
    runtime: project venv (tools/knowledge/.venv) + native lbug/OpenSSL DLLs
    entry_points: [tools.knowledge.mcp_server (python -m tools.knowledge.mcp_server), tools.knowledge.ingest.build_graph]
    hardware: none
    side_effect: NONE (read-only graph + deterministic offline ingestion)
    capabilities:
      - ladybugdb_graph
      - deterministic_ingestion
      - provenance_evidence
      - read_only_knowledge_mcp
      - opencode_agent_integration
    offline_tested: true       # 18 knowledge tests
    physically_proven: false   # offline only
    source_revision: 8fa3a6e
    mcp_service: knowledge
    migration_candidate: false

