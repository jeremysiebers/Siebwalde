      - firmware_image_verification
    offline_tested: true       # checksum_verify_tests.ps1
    physically_proven: false
    source_revision: 8fa3a6e
    mcp_service: null
    migration_candidate: true  # candidates for future Diagnostics Core (checksum verify)
